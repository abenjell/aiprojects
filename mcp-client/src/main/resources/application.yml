server:
  port: 8081

agents:
  backlog-refiner:
    model: "openrouter/free"
    temperature: 0.1
  architect:
    model: "google/gemma-4-31b-it:free"
    temperature: 0.2
  developer:
    model: "cohere/north-mini-code:free"
    temperature: 0.1
  qa:
    model: "cohere/north-mini-code:free"
    temperature: 0.2
  performance:
    model: "google/gemma-4-31b-it:free"
    temperature: 0.1

spring:
  application:
    name: mcp-client
  ai:
    mcp:
      client:
        stdio:
          servers-configuration: "classpath:mcp-servers.json"
    openai:
      timeout: 300s
      client:
        connect-timeout: 45s
        read-timeout: 300s
        write-timeout: 45s
